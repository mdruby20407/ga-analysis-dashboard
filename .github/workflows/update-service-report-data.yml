name: Update Service Report Data

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update-service-report-data.mjs'
      - '.github/workflows/update-service-report-data.yml'
  schedule:
    - cron: "0 9 * * 5"

permissions:
  contents: write

jobs:
  update-service-report-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Recalculate service report data
        run: node scripts/update-service-report-data.mjs

      - name: Commit updated service report data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/service-report-data.json
          git diff --cached --quiet && exit 0
          git commit -m "自動更新客服工作回報資料"
          git pull --rebase origin main
          git push origin HEAD:main

